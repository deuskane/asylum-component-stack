name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
jobs:
#<GENERATE_BEGIN>
  sim_basic:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_basic

  sim_cyclic:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_cyclic

  sim_cyclic_async_reset:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_cyclic_async_reset

  sim_cyclic_cke:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_cyclic_cke

  sim_cyclic_cyclic:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_cyclic_cyclic

  sim_cyclic_lifo:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_cyclic_lifo

  sim_cyclic_push_full:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_cyclic_push_full

  sim_cyclic_push_pop:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_cyclic_push_pop

  sim_cyclic_random:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_cyclic_random

  sim_cyclic_reset_values:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_cyclic_reset_values

  sim_cyclic_sync_reset:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_cyclic_sync_reset

  sim_overwrite:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_overwrite

  lint_ghdl:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl

  lint_ghdl_synth_32x10b:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_32x10b

  lint_ghdl_synth_4x16b_overwrite:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_4x16b_overwrite

  lint_ghdl_synth_8x8b:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_8x8b

  lint_ghdl_synth_cyclic:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_cyclic

  lint_ghdl_synth_default:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_default

  syn_32x10b:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: syn_32x10b

  syn_4x16b_overwrite:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: syn_4x16b_overwrite

  syn_8x8b:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: syn_8x8b

  syn_cyclic:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: syn_cyclic

  syn_default:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: syn_default

  badges:
    needs: [sim_basic, sim_cyclic, sim_cyclic_async_reset, sim_cyclic_cke, sim_cyclic_cyclic, sim_cyclic_lifo, sim_cyclic_push_full, sim_cyclic_push_pop, sim_cyclic_random, sim_cyclic_reset_values, sim_cyclic_sync_reset, sim_overwrite, lint_ghdl, lint_ghdl_synth_32x10b, lint_ghdl_synth_4x16b_overwrite, lint_ghdl_synth_8x8b, lint_ghdl_synth_cyclic, lint_ghdl_synth_default, syn_32x10b, syn_4x16b_overwrite, syn_8x8b, syn_cyclic, syn_default]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: deuskane/asylum-ci/.github/workflows/badges.yml@main
    with:
      results: ${{ toJSON(needs) }}

#<GENERATE_END>
